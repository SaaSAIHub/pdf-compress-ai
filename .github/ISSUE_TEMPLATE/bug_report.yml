name: Bug report
description: Report a reproducible problem with PDF-Compress.ai.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Do not attach confidential PDFs, personal documents, credentials, or unreviewed network logs. Use a synthetic example if a sample is needed.
  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have removed private information from this report and any attachments.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open PDF-Compress.ai
        2. Select a PDF
        3. Choose a mode and start compression
        4. Describe the result
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Compression mode
      options:
        - Light
        - Balanced
        - Strong
        - Not applicable or not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Browser name and version; operating system; desktop or mobile
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: General PDF details
      description: Approximate file size, page count, batch size, and whether it is scanned, image-heavy, signed, or password-protected. Do not include sensitive content or filenames.
  - type: textarea
    id: error
    attributes:
      label: Error message or additional context
      description: Copy the message shown by the tool, removing any private information.
