name: Feature request
description: Suggest an improvement to the product or its documentation.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: This issue will be public. Describe your use case without including private documents or personal information.
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: Describe the task and what is difficult in the current workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Explain the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe anything you have tried and where it falls short.
